# Accessible at \\kiosk\slideshow from Windows without a password.
# Drop .jpg / .png / .mp4 files here; they appear in the loop on next cycle.
[slideshow]
   comment = Kiosk Slideshow Media
   path = /home/pi/slideshow
   browseable = yes
   read only = no
   guest ok = yes
   guest only = yes
   force user = pi
   create mask = 0664
   directory mask = 0775
